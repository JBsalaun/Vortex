# Docs: Electron - https://docs.flatpak.org/en/latest/electron.html
# Docs: Dotnet - https://docs.flatpak.org/en/latest/dotnet.html
app-id: com.nexusmods.vortex
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: run.sh

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.dotnet9

build-options:
  # dotnet9/bin must come before /app/bin: the dotnet-runtime module symlinks
  # a runtime-only `dotnet` (no SDK) into /app/bin, which would shadow the SDK.
  prepend-path: /usr/lib/sdk/dotnet9/bin:/app/bin:/usr/lib/sdk/node24/bin
  append-ld-library-path: /usr/lib/sdk/dotnet9/lib
  env:
    # Compile both the main and renderer bundles as production artifacts.
    # Otherwise webpack retains development-only imports such as redux-freeze.
    NODE_ENV: production

    # Electron install behavior (global): prevent Electron downloads because BaseApp provides it.
    # Ref: https://github.com/electron/electron/blob/main/docs/api/environment-variables.md
    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    # Node/pnpm offline cache locations for reproducible builds.
    # Flatpak builds run offline by default; these paths are inside the build sandbox.
    # Ref: https://docs.flatpak.org/en/latest/electron.html#the-application-module
    npm_config_cache: /run/build/vortex/flatpak-node/npm-cache
    npm_config_nodedir: /usr/lib/sdk/node24
    npm_config_offline: "true"
    pnpm_config_verify_deps_before_run: "none"
    # No TTY in the sandbox: pnpm's ci-info check skips the interactive purge prompt.
    CI: "true"
    XDG_CACHE_HOME: /run/build/vortex/flatpak-node/cache
    PNPM_HOME: /app/bin

    # Dotnet SDK settings for build-time tools (runtime DOTNET_ROOT is set via finish-args).
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    DOTNET_ROOT: /usr/lib/sdk/dotnet9/lib
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    # Build stability: avoid parallel extension builds.
    # Skip git submodule updates (submodules are already fetched by flatpak-builder).
    # FOMOD installer builds are still needed and run during preinstall.
    NO_PARALLEL: "1"
    VORTEX_SKIP_SUBMODULES: "1"

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  # Full host filesystem access is required for modding workflows:
  # game installs can be anywhere, deployment uses hardlinks/symlinks/moves,
  # plugins and external tools need arbitrary path access.
  # Portals are not viable because scanning and deployment are background ops
  # that can't wait for user-mediated prompts.
  - --filesystem=host
  - --talk-name=org.kde.StatusNotifierWatcher
  - --system-talk-name=org.freedesktop.UDisks2
  # Required for xdg-settings to register nxm:// protocol handler on host
  - --talk-name=org.freedesktop.Flatpak
  # Runtime: .NET runtime location for framework-dependent tools
  - --env=DOTNET_ROOT=/app/lib/dotnet
  # Integration: disable internal updater (Flatpak handles updates)
  - --env=IGNORE_UPDATES=yes
  - --env=IS_FLATPAK=true
  # Integration: use gio for trash, respect host cursor theme
  - --env=ELECTRON_TRASH=gio
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: dotnet-runtime
    buildsystem: simple
    build-commands:
      # Install the .NET runtime into /app/lib/dotnet for framework-dependent tools.
      - /usr/lib/sdk/dotnet9/bin/install.sh

  - name: vortex
    buildsystem: simple
    build-commands:
      # Steps match `.github/workflows/package.yml` where possible.

      # Configure pnpm for Flatpak caches, then install dependencies.
      - |
        cat > NuGet.Config <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="offline" value="flatpak-nuget-sources" />
          </packageSources>
        </configuration>
        EOF
      # tools/dotnetprobe/nuget.config clears and points at nuget.org; override it for the offline build.
      - |
        cat > tools/dotnetprobe/nuget.config <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="offline" value="/run/build/vortex/flatpak-nuget-sources" />
          </packageSources>
        </configuration>
        EOF
      - mkdir -p flatpak-node/pnpm
      - tar -xzf flatpak-node/pnpm-tarballs/pnpm-11.10.0.tgz --strip-components=1 -C flatpak-node/pnpm
      # pnpm 11.10 prunes catalogs into the deploy lockfile but omits the
      # corresponding catalog configuration from the deploy workspace file.
      - |
        node <<'NODE'
        const fs = require('fs');
        const pnpmPath = 'flatpak-node/pnpm/dist/pnpm.mjs';
        let source = fs.readFileSync(pnpmPath, 'utf8');
        const workspaceMarker = '  if (deployFiles.workspaceManifest) {';
        const workspaceReplacement = `  const deployCatalogs = Object.fromEntries(
          Object.entries(deployFiles.lockfile.catalogs ?? {}).map(([catalogName, catalog]) => [
            catalogName,
            Object.fromEntries(Object.entries(catalog).map(([name, entry]) => [name, entry.specifier])),
          ]),
        );
        if (deployFiles.workspaceManifest && deployCatalogs.default) {
          deployFiles.workspaceManifest.catalog = deployCatalogs.default;
        }
        ${workspaceMarker}`;
        const installMarker = '      rootProjectManifest: deployFiles.manifest,';
        const installReplacement = `${installMarker}
              catalogs: deployCatalogs,
              dedupePeers: deployFiles.lockfile.settings?.dedupePeers,`;
        if (!source.includes(workspaceMarker) || !source.includes(installMarker)) {
          throw new Error('Unable to apply the pnpm deploy catalog workaround');
        }
        source = source
          .replace(workspaceMarker, workspaceReplacement)
          .replace(installMarker, installReplacement);
        fs.writeFileSync(pnpmPath, source);
        NODE
      - printf '#!/bin/sh\nexport npm_config_store_dir=/run/build/vortex/flatpak-node/pnpm-store\nexec node /run/build/vortex/flatpak-node/pnpm/bin/pnpm.cjs "$@"\n' > /app/bin/pnpm && chmod +x /app/bin/pnpm
      - |
        node <<'NODE'
        const fs = require('fs');
        const pkg = require('./package.json');
        delete pkg.dependencies.node;
        delete pkg.devEngines.runtime;
        delete pkg.engines.node;
        fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

        let lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
        lock = lock.replace(/^      node:\n        specifier: 'catalog:'\n        version: runtime:24\.17\.0\n/m, '');
        const start = lock.indexOf('\n  node@runtime:24.17.0:\n');
        if (start !== -1) {
          const next = lock.slice(start + 1).search(/\n  \S/);
          const end = next === -1 ? lock.length : start + 1 + next;
          lock = lock.slice(0, start) + lock.slice(end);
        }
        lock = lock.replace(/^  node@runtime:24\.17\.0: \{\}\n/m, '');
        fs.writeFileSync('pnpm-lock.yaml', lock);
        NODE
      - VORTEX_ELECTRON_REBUILD=defer node flatpak-node/pnpm/bin/pnpm.cjs install --offline --frozen-lockfile --trust-lockfile --store-dir="$PWD/flatpak-node/pnpm-store"
      - PATH="$PWD/node_modules/.pnpm/node_modules/.bin:$PATH" node "$(find node_modules/.pnpm -path '*/@nexusmods/fomod-installer-native/install.js' -print -quit)"
      # font-scanner has no install script; pnpm's implicit node-gyp build did not run in the sandbox.
      - |
        pnpm_bin="$PWD/node_modules/.pnpm/node_modules/.bin"
        font_scanner_dir="$(dirname "$(find node_modules/.pnpm -path '*/font-scanner@*/node_modules/font-scanner/binding.gyp' -print -quit)")"
        cd "$font_scanner_dir" && PATH="$pnpm_bin:$PATH" node-gyp rebuild
      - node "$(find node_modules/.pnpm -path '*/@electron/rebuild/lib/cli.js' -print -quit)"
      # Build the app following the standard workflow from CONTRIBUTING.md.
      - pnpm run build

      # Deploy @vortex/main into a self-contained, hoisted dist/ folder.
      # pnpm is patched above so its pruned workspace retains catalog settings.
      - pnpm exec rimraf src/main/dist
      - |
        set -e
        cd src/main
        pnpm_config_inject_workspace_packages=true pnpm_config_node_linker=hoisted \
            VORTEX_ELECTRON_REBUILD=skip \
          pnpm --store-dir=/run/build/vortex/flatpak-node/pnpm-store \
            --offline --frozen-lockfile --trust-lockfile -F @vortex/main deploy ./dist
        node ./dist/prepare-dist-package.mjs

      # Build Electron distribution with electron-builder (dir target)
      # The shared electron-builder config writes to the repository dist/ folder.
      - cd src/main/dist && pnpm exec electron-builder --config electron-builder.config.json --publish never --linux dir

      # Install the launcher, desktop file, icon, and metainfo into the Flatpak image.
      - install -Dm755 flatpak/run.sh /app/bin/run.sh
      - install -Dm644 flatpak/com.nexusmods.vortex.desktop /app/share/applications/com.nexusmods.vortex.desktop
      - install -Dm644 assets/images/vortex.png /app/share/icons/hicolor/256x256/apps/com.nexusmods.vortex.png
      - install -Dm644 flatpak/com.nexusmods.vortex.metainfo.xml /app/share/metainfo/com.nexusmods.vortex.metainfo.xml

      # Stage the built electron distribution into /app/main for runtime.
      - install -d /app/main
      - cp -a dist/linux*-unpacked/. /app/main/
    sources:
      - type: dir
        path: ..
      - generated-sources.json
      - generated-nuget-sources.json
